app-id: org.example.GnomeTestRust
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gnome-test-rust
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
modules:
  - name: libshumate
    buildsystem: meson
    config-opts:
      - -Dvector_renderer=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libshumate.git
        tag: 1.6.0

  - name: gnome-test-rust
    buildsystem: simple
    build-commands:
      - install -D target/release/gnome-test-rust /app/bin/gnome-test-rust
      - install -D icon.png /app/share/icons/hicolor/128x128/apps/org.example.GnomeTestRust.png
      - install -D org.example.GnomeTestRust.desktop /app/share/applications/org.example.GnomeTestRust.desktop
      - install -D org.example.GnomeTestRust.appdata.xml /app/share/metainfo/org.example.GnomeTestRust.appdata.xml
    sources:
      - type: dir
        path: .
