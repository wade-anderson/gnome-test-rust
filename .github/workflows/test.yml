name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev \
          libadwaita-1-dev \
          libshumate-dev \
          xvfb \
          at-spi2-core \
          dbus-x11 \
          python3-gi \
          python3-pyatspi \
          scrot \
          python3-pil

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Tarpaulin
      run: |
        if ! command -v cargo-tarpaulin &> /dev/null; then
          cargo install cargo-tarpaulin
        fi

    - name: Run Unified Test Suite
      run: |
        # Run the unified test runner under xvfb (virtual display) and dbus-run-session
        # This ensures all accessibility components share the same display and bus.
        xvfb-run --auto-servernum dbus-run-session bash scripts/run_tests.sh
