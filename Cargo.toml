[package]
name = "gnome-test-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
glib = "0.22.7"
gtk4 = "0.11.3"
libadwaita = "0.9.1"
libshumate = "0.8.0"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt", "macros", "sync", "rt-multi-thread"] }

[dev-dependencies]
httpmock = "0.8.0"
criterion = { version = "0.5.1", features = ["async_tokio"] }

[[bench]]
name = "geo_benchmark"
harness = false
